
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-24.04'

steps:
  # Step 1: Checkout source code
  - checkout: self
    displayName: 'Checkout source code'

  # Step 2: Validate repository files
  - bash: |
      set -euo pipefail

      echo "Checking repository files..."

      test -f test.txt
      grep -Fxq "Created test file" test.txt

      echo "Repository validation successful!"
    displayName: 'Validate repository content'

  # Step 3: Prepare build package
  - bash: |
      set -euo pipefail

      mkdir -p "$(Build.ArtifactStagingDirectory)/package"

      cp test.txt "$(Build.ArtifactStagingDirectory)/package/"
      cp azure-pipelines.yml "$(Build.ArtifactStagingDirectory)/package/"

      echo "Build ID: $(Build.BuildId)" > "$(Build.ArtifactStagingDirectory)/package/build-info.txt"
    displayName: 'Prepare package'

  # Step 4: Publish artifact
  - task: PublishPipelineArtifact@1
    displayName: 'Publish CI artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/package'
      artifact: 'githubdemo-package'
      publishLocation: 'pipeline'
